parameters:
- name: srcPath
  type: string
  default: '.'
- name: runStaticAnalysis
  type: boolean
  default: False
- name: builddir
  type: string
  default: 'jcd_build'  
- name: ldpath
  type: string
  default: '' 

steps:
- script: |
    if [ -n "$JCD_LDPATH" ]; then
        export LD_LIBRARY_PATH="$JCD_LDPATH:$LD_LIBRARY_PATH"
    fi
    
    cd -- "$JCD_SRC_PATH" || exit 1
    cargo build --release
  displayName: "Build jcd"
  env:
    JCD_LDPATH: ${{ parameters.ldpath }}
    JCD_SRC_PATH: ${{ parameters.srcPath }}
